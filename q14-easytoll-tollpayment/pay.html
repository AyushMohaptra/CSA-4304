<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyToll FASTag Portal | EasyToll Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">EasyToll</a>
  <div class="nav-links">
    <a href="index.html">Plaza & FASTag</a>
    <a href="pay.html">Recharge Wallet</a>
    <a href="history.html">Pass & Toll Ledger</a>
    <a href="admin.html">Plaza Admin</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<div class="container">

  <h2>Plaza Toll Calculator & Instant Payment</h2>
  <div class="card" style="max-width:550px;">
    <div class="form-group">
      <label>Vehicle Category</label>
      <select id="tollVeh">
        <option value="85">Car / Jeep / Van (₹85)</option>
        <option value="135">Light Commercial Vehicle - LCV (₹135)</option>
        <option value="275">Bus / 2-Axle Truck (₹275)</option>
        <option value="425">Heavy Multi-Axle Vehicle (₹425)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Trip Type</label>
      <select id="tollTrip">
        <option value="1">Single Journey</option>
        <option value="1.5">Return Journey (24 Hours - 50% discount on return)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Toll Plaza Location</label>
      <select id="tollPlaza">
        <option>Paranur Toll Plaza (NH-45)</option>
        <option>Athur Toll Plaza (NH-45)</option>
        <option>Sriperumbudur Toll Plaza (NH-4)</option>
      </select>
    </div>
    <button class="btn" onclick="processTollPayment()">Deduct & Generate Toll Receipt</button>
    <div id="tollReceipt"></div>
  </div>

</div>

<footer>
  <p>&copy; 2026 EasyToll FASTag Portal. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsureEasy Insurance | InsureEasy Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">InsureEasy</a>
  <div class="nav-links">
    <a href="index.html">Coverage Plans</a>
    <a href="quote.html">Premium Calculator</a>
    <a href="claim.html">File Claim</a>
    <a href="admin.html">Claims Admin</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<div class="container">

  <h2>Instant Premium Quote Calculator</h2>
  <div class="card" style="max-width:550px;">
    <div class="form-group">
      <label>Insurance Category</label>
      <select id="insCat" onchange="updateCoverages()">
        <option value="health">Health Insurance</option>
        <option value="auto">Auto / Motor Insurance</option>
        <option value="life">Term Life Insurance</option>
      </select>
    </div>
    <div class="form-group">
      <label>Insured Person Age</label>
      <input type="number" id="insAge" value="28">
    </div>
    <div class="form-group">
      <label>Coverage Sum (₹)</label>
      <select id="insSum">
        <option value="500000">₹5 Lakhs</option>
        <option value="1000000" selected>₹10 Lakhs</option>
        <option value="2500000">₹25 Lakhs</option>
        <option value="10000000">₹1 Crore</option>
      </select>
    </div>
    <button class="btn" onclick="calcPremium()">Get Annual Premium</button>
    <div id="premiumResult" style="margin-top:1rem;"></div>
  </div>

</div>

<footer>
  <p>&copy; 2026 InsureEasy Insurance. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>

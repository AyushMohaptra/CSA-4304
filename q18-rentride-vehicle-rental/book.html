<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentRide Vehicle Rentals | RentRide Vehicle Rentals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">RentRide</a>
  <div class="nav-links">
    <a href="index.html">Fleet Browse</a>
    <a href="book.html">Reserve Vehicle</a>
    <a href="history.html">Booking History</a>
    <a href="admin.html">Fleet Admin</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<div class="container">

  <h2>Vehicle Reservation & Fare Estimator</h2>
  <div class="card" style="max-width:550px;">
    <form onsubmit="confirmRental(event)">
      <div class="form-group">
        <label>Customer Full Name</label>
        <input type="text" id="rentName" required placeholder="Alexander Pierce">
      </div>
      <div class="form-group">
        <label>Driving License No.</label>
        <input type="text" id="rentDL" required placeholder="DL-042011009842">
      </div>
      <div class="form-group">
        <label>Select Vehicle Model</label>
        <select id="rentVeh" onchange="calcRental()">
          <option value="1400">Swift ZXi (₹1,400/day)</option>
          <option value="3200">Mahindra XUV 700 (₹3,200/day)</option>
          <option value="1800">Tata Ace Mini Truck (₹1,800/day)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Rental Duration (Days)</label>
        <input type="number" id="rentDays" min="1" value="3" onchange="calcRental()">
      </div>
      <div class="form-group">
        <label>Pick-up Date</label>
        <input type="date" id="rentDate" required>
      </div>
      <div class="alert alert-success" id="fareBox">
        Total Fare: <strong id="fareTotal">₹4,200</strong> (Includes unlimited km & taxes)
      </div>
      <button type="submit" class="btn">Confirm Reservation</button>
    </form>
    <div id="bookingConfirmation"></div>
  </div>

</div>

<footer>
  <p>&copy; 2026 RentRide Vehicle Rentals. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>

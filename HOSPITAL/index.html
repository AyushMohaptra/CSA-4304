<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedCare Hospital Appointment Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🏥 MedCare Hospital</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Patient Login</a>
    <a href="register.html">Register</a>
    <a href="hospital.html">Hospital</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>
<main>
  <h2>Find a Doctor</h2>
  <input id="search" placeholder="Search doctor, specialty or hospital..." oninput="showDoctors()">
  <select id="specialty" onchange="showDoctors()">
    <option value="All">All Specialties</option>
    <option>Cardiology</option><option>Dermatology</option><option>Pediatrics</option><option>Orthopedics</option><option>General Medicine</option>
  </select>
  <select id="location" onchange="showDoctors()">
    <option value="All">All Locations</option><option>Chennai</option><option>Sriperumbudur</option><option>Kanchipuram</option>
  </select>
  <div id="doctors"></div>

  <h2>Book an Appointment</h2>
  <label>Patient name <input id="patient" placeholder="Enter your name"></label>
  <label>Doctor <select id="doctor"></select></label>
  <label>Date <input id="date" type="date"></label>
  <label>Time <select id="time"><option>09:00 AM</option><option>10:00 AM</option><option>11:00 AM</option><option>02:00 PM</option><option>03:00 PM</option></select></label>
  <button onclick="bookAppointment()">Book Appointment</button>
  <p id="message"></p>

  <h2>Check-in Form</h2>
  <label>Appointment ID <input id="checkinId" placeholder="Enter appointment ID"></label>
  <label>Reason for visit <input id="reason" placeholder="Reason for appointment"></label>
  <button onclick="checkIn()">Submit Check-in</button>
  <p id="checkinMessage"></p>

  <h2>My Appointments</h2>
  <div id="myAppointments">No appointments yet.</div>

  <h2>Doctor Reviews</h2>
  <label>Doctor <select id="reviewDoctor"></select></label>
  <label>Rating <select id="rating"><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select></label>
  <label>Review <textarea id="reviewText" placeholder="Write your feedback"></textarea></label>
  <button onclick="submitReview()">Submit Review</button><p id="reviewMessage"></p>
</main>
<script src="js/app.js"></script>
</body>
</html>

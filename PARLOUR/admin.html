<body>
<header><h1>Salon Manager</h1><nav><a href="index.html">Home</a><a href="login.html">Customer Login</a></nav></header>
<main>
  <h2>Manager Login</h2>
  <p><b>Username:</b> manager</p><p><b>Password:</b> salon123</p>
  <label>Username <input id="username"></label><label>Password <input id="password" type="password"></label>

  <section id="manager" hidden>

    <button onclick="lockSlot()">Lock Slot</button><p id="lockMessage"></p>

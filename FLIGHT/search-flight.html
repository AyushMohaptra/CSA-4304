<!DOCTYPE html>
<html>
<head>
  <title>Search Flights</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="top">
    <h2>✈ SkyBook</h2>
    <nav>
      <a href="index.html">Home</a>
      <div class="dropdown"><a href="#">Flights ▾</a><div class="dropmenu">
        <a href="search-flight.html">Search Flights</a><a href="booking.html">Book Ticket</a><a href="booking-status.html">Booking Status</a>
      </div></div>
      <div class="dropdown"><a href="#">My Account ▾</a><div class="dropmenu">
        <a href="login.html">Login</a><a href="register.html">Register</a><a href="my-ticket.html">My Ticket</a><a href="cancel-ticket.html">Cancel Ticket</a>
      </div></div>
      <a href="feedback.html">Feedback</a><a href="admin-login.html">Admin</a>
    </nav>
  </div>
</header>

<main>
  <h1>Search Available Flights</h1>
  <form id="flightSearchForm">
    <div class="grid">
      <div><label>From</label><select id="from" required>
        <option value="">Select</option><option>Chennai</option><option>Bangalore</option><option>Delhi</option><option>Mumbai</option><option>Hyderabad</option>
      </select></div>
      <div><label>To</label><select id="to" required>
        <option value="">Select</option><option>Chennai</option><option>Bangalore</option><option>Delhi</option><option>Mumbai</option><option>Hyderabad</option>
      </select></div>
      <div><label>Date</label><input id="date" type="date" required></div>
      <div><label>Class</label><select id="flightClass">
        <option value="All">All Classes</option><option value="Economy">Economy</option><option value="Business">Business</option>
      </select></div>
    </div>
    <input type="submit" value="Search">
  </form>

  <div id="searchMessage"></div>
  <div id="flightResults"></div>
</main>

<footer>© 2026 SkyBook Flight Reservation System</footer>
<script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Customer Registration</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><div class="top"><h2>✈ SkyBook</h2><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></div></header>
<main class="small">
  <h1>Create Account</h1>
  <form onsubmit="registerCustomer(event)">
    <label>Full Name</label><input type="text" required>
    <label>Email</label><input type="email" required>
    <label>Phone</label><input type="tel" required>
    <label>Password</label><input type="password" required>
    <label>Confirm Password</label><input type="password" required>
    <input type="submit" value="Register">
  </form>
</main>
<footer>© 2026 SkyBook Flight Reservation System</footer>
<script src="js/script.js"></script>
</body>
</html>

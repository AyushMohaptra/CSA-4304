<!DOCTYPE html>
<html>
<head><title>Customer Feedback</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><div class="top"><h2>✈ SkyBook</h2><nav><a href="index.html">Home</a><a href="my-ticket.html">My Ticket</a></nav></div></header>
<main class="small">
  <h1>Customer Feedback</h1>
  <form onsubmit="sendFeedback(event)">
    <label>Name</label><input type="text" required>
    <label>Email</label><input type="email" required>
    <label>Rating</label>
    <select><option>5 - Excellent</option><option>4 - Good</option><option>3 - Average</option><option>2 - Poor</option><option>1 - Very Poor</option></select>
    <label>Comments</label><textarea required placeholder="Write your feedback"></textarea>
    <input type="submit" value="Submit Feedback">
  </form>
</main>
<footer>© 2026 SkyBook Flight Reservation System</footer>
<script src="js/script.js"></script>
</body>
</html>

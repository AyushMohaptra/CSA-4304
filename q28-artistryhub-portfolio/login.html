<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtistryHub Artist Portfolio | Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">ArtistryHub Artist Portfolio</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Artist</a>
    <a href="exhibitions.html">Exhibitions & News</a>
    <a href="login.html" class="active">Login</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<div class="container" style="max-width: 480px; margin: 40px auto;">
  <div class="card" style="padding: 24px; box-shadow: var(--shadow);">
    <h2 style="margin-bottom: 6px;">Sign In to Your Account</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 18px;">
      Original oil paintings, digital art exhibitions, and artist bibliography.
    </p>

    <!-- 1-Click Fast Demo Login -->
    <div style="background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; padding: 12px; margin-bottom: 18px;">
      <div style="font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px;">Quick Demo Access:</div>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-outline" style="flex: 1; padding: 6px 10px; font-size: 12px;" onclick="quickLogin('Art Enthusiast')">Demo Art Enthusiast</button>
        <button type="button" class="btn btn-outline" style="flex: 1; padding: 6px 10px; font-size: 12px; border-color: var(--primary); color: var(--primary);" onclick="quickLogin('Administrator')">Demo Admin</button>
      </div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 500; font-size: 13px; margin-bottom: 5px;">Username / Email *</label>
        <input type="text" id="username" class="form-control" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;" placeholder="e.g. user@example.com" required>
      </div>
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 500; font-size: 13px; margin-bottom: 5px;">Password *</label>
        <input type="password" id="password" class="form-control" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;" placeholder="Enter password (e.g. 123)" required>
      </div>
      <div class="form-group" style="margin-bottom: 18px;">
        <label style="display: block; font-weight: 500; font-size: 13px; margin-bottom: 5px;">Sign in As Role</label>
        <select id="userRole" class="form-control" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
          <option value="art enthusiast">Art Enthusiast</option>
          <option value="curator">Curator</option>
          <option value="artist">Artist</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px; font-weight: 600;">Sign In</button>
    </form>

    <div id="loginMsg" style="margin-top: 12px; font-size: 13px;"></div>

    <div style="margin-top: 18px; text-align: center; font-size: 13px; border-top: 1px solid var(--border); padding-top: 14px;">
      Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register Here &rarr;</a>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 ArtistryHub Artist Portfolio. All rights reserved.</p>
</footer>

<script>
function quickLogin(role) {
  const user = {
    username: role.toLowerCase().replace(/\s+/g, '_'),
    name: 'Demo ' + role,
    role: role
  };
  localStorage.setItem('q28_artistryhub_portfolio_session', JSON.stringify(user));
  showMsg('Signed in as ' + user.name + '! Redirecting...', 'success');
  setTimeout(() => { window.location.href = 'index.html'; }, 500);
}

function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const r = document.getElementById('userRole').value;
  if (!u || !p) return;
  const user = { username: u, name: u.split('@')[0], role: r };
  localStorage.setItem('q28_artistryhub_portfolio_session', JSON.stringify(user));
  showMsg('Welcome, ' + user.name + '! Sign in successful.', 'success');
  setTimeout(() => { window.location.href = 'index.html'; }, 500);
}

function showMsg(text, type) {
  const m = document.getElementById('loginMsg');
  m.innerHTML = '<div style="padding:10px; border-radius:6px; background:' + (type === 'success' ? '#ecfdf5' : '#fef2f2') + '; color:' + (type === 'success' ? '#065f46' : '#991b1b') + '; border:1px solid ' + (type === 'success' ? '#a7f3d0' : '#fecaca') + ';">' + text + '</div>';
}
</script>
</body>
</html>

<div class="container">

  <h2>Schedule a Property Site Visit</h2>
  <div class="card" style="max-width:550px;">
    <form onsubmit="scheduleSiteVisit(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="visName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Contact Phone</label>
        <input type="tel" id="visPhone" required placeholder="9876543210">
      </div>
      <div class="form-group">
        <label>Select Property</label>
        <select id="visProp">
          <option>Greenwood Heights (3 BHK - ₹85 Lakhs)</option>
          <option>Palm Breeze Villa (4 BHK - ₹1.8 Crore)</option>
          <option>Metro Hub Commercial (Office Space - ₹65 Lakhs)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Preferred Visit Date</label>
        <input type="date" id="visDate" required>
      </div>
      <button type="submit" class="btn">Confirm Appointment</button>
    </form>
    <div id="visitAlert"></div>
  </div>

</div>
